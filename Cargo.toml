[package]
name = "passdown"
version = "0.1.0"
edition = "2024"
# Floor set by let-chains, stabilized in 1.88.
rust-version = "1.88"
license = "GPL-3.0-or-later"
autolib = false
publish = false
description = "A really, really simple Markdown formatter with as few knobs as possible."
repository = "https://github.com/eljpsm/passdown"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Exact pin: the output is part of the contract and comrak releases change
# rendering.
comrak = { version = "=0.54.0", default-features = false }
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "1"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

[profile.release]
strip = true
lto = true

# Make plain `cargo clippy` and rust-analyzer as strict as CI. Clippy lints
# do not run under `cargo build`, so toolchain bumps cannot break `nix build`.
[lints.clippy]
all = "deny"
